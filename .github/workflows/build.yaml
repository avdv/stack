
on:
  push:

jobs:
  
  build-and-upload:
    strategy:
      fail-fast: true
      matrix:
        os:
        - ubuntu-latest
        - macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Stack
        if: matrix.os == 'macos-13'
        run: |
          curl -sSL https://get.haskellstack.org | sh

      - name: Build and test with Stack
        run: |
          stack build
          cp $(stack path --dist-dir)/build/stack/stack stack-${{ runner.os }}
          #stack test

      - name: Test
        run: |
          mkdir unpack
          cd unpack
          for ((i=0; i<99; ++i)); do
              ../stack-${{ runner.os }} --resolver ../stackage_snapshot.yaml unpack HUnit-1.6.2.0 QuickCheck-2.14.3 ansi-terminal-0.11.5 ansi-terminal-types-0.11.5 ansi-wl-pprint-0.6.9 async-2.2.5 attoparsec-0.14.4 base-compat-0.12.3 base-compat-batteries-0.12.3 base-orphans-0.9.1 bifunctors-5.5.15 bitvec-1.1.5.0 bytestring-builder-0.10.8.2.0 call-stack-0.4.0 colour-2.3.6 comonad-5.0.8 conduit-1.3.5 conduit-extra-1.3.6 distributive-0.6.2.1 foldable1-classes-compat-0.1 generic-deriving-1.14.5 hashable-1.4.3.0 haskell-lexer-1.1.1 hspec-2.10.10 hspec-core-2.10.10 hspec-discover-2.10.10 hspec-expectations-0.8.2 indexed-traversable-0.1.3 integer-logarithms-1.0.3.1 mono-traversable-1.0.15.3 network-3.1.4.0 optparse-applicative-0.17.1.0 primitive-0.8.0.0 quickcheck-io-0.2.0 random-1.2.1.1 resourcet-1.2.6 scientific-0.3.7.0 setenv-0.1.1.3 splitmix-0.1.0.5 streaming-commons-0.2.2.6 tagged-0.8.7 text-show-3.10.4 tf-random-0.5 th-abstraction-0.4.5.0 th-lift-0.8.4 transformers-compat-0.7.2 typed-process-0.2.11.1 unliftio-core-0.2.1.0 unordered-containers-0.2.19.1 vector-0.13.1.0 vector-algorithms-0.9.0.1 vector-stream-0.1.0.0 zlib-0.6.3.0
              sleep 15
              rm -rf *
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stack-${{ runner.os }}
          path: stack-${{ runner.os }}
          if-no-files-found: error
